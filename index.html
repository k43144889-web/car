<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eceef2; --border:#dde1e7;
    --text:#181b20; --text-2:#565f6b; --text-3:#8890a0;
    --accent:#d9622b; --accent-strong:#b94f20; --accent-ink:#fff8f3;
    --good:#147a4e; --bad:#c23b3b;
    --shadow: 0 1px 2px rgba(20,20,25,.04), 0 8px 24px rgba(20,20,25,.06);
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101217; --surface:#181b21; --surface-2:#20242c; --border:#2b303a;
      --text:#eef0f3; --text-2:#a7aeb9; --text-3:#767e8c;
      --accent:#ff9152; --accent-strong:#ffab74; --accent-ink:#1a0f08;
      --good:#34d399; --bad:#ff6b6b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101217; --surface:#181b21; --surface-2:#20242c; --border:#2b303a;
    --text:#eef0f3; --text-2:#a7aeb9; --text-3:#767e8c;
    --accent:#ff9152; --accent-strong:#ffab74; --accent-ink:#1a0f08;
    --good:#34d399; --bad:#ff6b6b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif;}
  .display{font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:700; letter-spacing:.2px;}
  .tnum{font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
  input,select,textarea{font-family:inherit; font-size:15px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 11px; width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  label{display:block; font-size:12.5px; color:var(--text-2); font-weight:600; margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px;}
  .field{margin-bottom:14px;}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field-row > .field{flex:1 1 140px;}

  #wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:0 40px;}

  header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top,0px);}
  .hdr-inner{max-width:1080px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .brandmark{display:flex; align-items:center; gap:9px;}
  .brandmark .dot{width:11px;height:11px;border-radius:3px;background:var(--accent); transform:rotate(45deg);}
  .brandmark span{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; letter-spacing:.3px;}
  nav.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px;}
  nav.tabs button{border:none; background:transparent; padding:8px 16px; border-radius:7px; font-weight:700; font-size:14px; color:var(--text-2);}
  nav.tabs button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
  .hdr-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
  .who{font-size:13px; color:var(--text-2); background:var(--surface-2); border-radius:20px; padding:6px 12px; border:none; font-weight:600;}
  .who b{color:var(--text);}

  .btn{border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 15px; border-radius:9px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
  .btn:hover{border-color:var(--text-3);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--text-2); padding:7px 10px;}
  .btn.ghost:hover{color:var(--text); background:var(--surface-2);}
  .btn.danger{color:var(--bad);}
  .btn.small{padding:6px 11px; font-size:13px; border-radius:7px;}
  .btn:disabled{opacity:.5; cursor:default;}

  main{padding-top:22px;}
  .section-title{font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-2); margin-bottom:12px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);}
  .kpi .lbl{font-size:12.5px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .kpi .val{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; margin-top:6px;}
  .kpi .sub{font-size:12.5px; color:var(--text-3); margin-top:2px;}
  .val.good{color:var(--good);} .val.bad{color:var(--bad);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:18px; margin-bottom:24px;}
  .empty{color:var(--text-3); font-size:14px; padding:18px 4px;}

  .bar-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .bar-row:last-child{border-bottom:none;}
  .bar-row:hover .bar-name{color:var(--accent);}
  .bar-name{flex:0 0 150px; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1; height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; display:flex;}
  .bar-fill{height:100%; border-radius:6px; min-width:3px;}
  .bar-amt{flex:0 0 auto; font-weight:700; font-size:14px; min-width:96px; text-align:right;}

  .feed-row{display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; flex-wrap:wrap;}
  .feed-row:last-child{border-bottom:none;}
  .feed-date{color:var(--text-3); font-size:12.5px; flex:0 0 74px;}
  .feed-mid{flex:1; min-width:140px;}
  .feed-mid .car{font-weight:700;}
  .feed-mid .cat{color:var(--text-2); font-size:12.5px;}
  .feed-amt{font-weight:700; margin-left:auto;}

  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .chip{border:1px solid var(--border); background:var(--surface); padding:7px 14px; border-radius:20px; font-size:13.5px; font-weight:700; color:var(--text-2);}
  .chip.active{background:var(--text); color:var(--bg); border-color:var(--text);}

  .car-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .car-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
  .car-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .car-card .name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:21px; line-height:1.1;}
  .car-card .lot{color:var(--text-3); font-size:12.5px; margin-top:2px;}
  .pill{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap;}
  .pill.active{background:#d9622b22; color:var(--accent-strong);}
  .pill.sold{background:#147a4e22; color:var(--good);}
  .stat3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; background:var(--surface-2); border-radius:10px; padding:10px;}
  .stat3 div{text-align:center;}
  .stat3 .l{font-size:10.5px; color:var(--text-3); text-transform:uppercase; font-weight:700;}
  .stat3 .v{font-weight:700; font-size:14px; margin-top:2px;}
  .card-actions{display:flex; gap:6px; margin-top:auto;}
  .card-actions .btn{flex:1; justify-content:center;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,10,14,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;}
  @media(min-width:640px){ .modal-backdrop{align-items:center; padding:20px;} }
  .modal{background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:22px; box-shadow:var(--shadow);}
  @media(min-width:640px){ .modal{border-radius:16px;} }
  .modal.wide{max-width:720px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-head h2{font-family:'Barlow Condensed',sans-serif; font-size:24px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; padding-top:16px; border-top:1px solid var(--border);}

  .tx-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .tx-row:last-child{border-bottom:none;}
  .tx-date{flex:0 0 78px; font-size:12.5px; color:var(--text-3);}
  .tx-mid{flex:1; min-width:130px;}
  .tx-mid .cat{font-weight:700; font-size:14px;}
  .tx-mid .note{color:var(--text-2); font-size:12.5px; margin-top:1px;}
  .tx-mid .who{color:var(--text-3); font-size:11.5px; margin-top:1px;}
  .tx-amt{font-weight:700; font-size:14.5px; min-width:100px; text-align:right;}
  .tx-actions{display:flex; gap:4px;}

  .detail-stat{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
  .detail-stat .box{background:var(--surface-2); border-radius:10px; padding:12px; text-align:center;}
  .detail-stat .box .l{font-size:11px; color:var(--text-3); text-transform:uppercase; font-weight:700;}
  .detail-stat .box .v{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; margin-top:2px;}

  .status-banner{max-width:1080px; margin:14px auto 0; padding:12px 16px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; font-size:13.5px; color:var(--text-2);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="hdr-inner">
      <div class="brandmark"><span class="dot"></span><span class="display">Учёт Машин</span></div>
      <nav class="tabs" id="tabs">
        <button data-tab="dashboard">Дашборд</button>
        <button data-tab="cars">Машины</button>
      </nav>
      <div class="hdr-right">
        <button class="who" id="whoBtn"></button>
        <button class="btn primary" id="quickAddBtn">+ Операция</button>
      </div>
    </div>
  </header>
  <main><div id="wrap"></div></main>
</div>
<div id="modal-root"></div>

<script>
(function(){
  "use strict";

  var state = {
    cars: new Map(),
    txs: new Map(),
    dbOK: null,
    tab: 'dashboard',
    carFilter: 'all',
    me: (function(){ try{ return localStorage.getItem('cl_ledger_name') || ''; }catch(e){ return ''; } })(),
    modalKind: null,
    detailCarId: null
  };
  var db = null;

  function fmtY(n){ return '¥' + Math.round(n||0).toLocaleString('ja-JP'); }
  function signedY(n){ var v = Math.round(n||0); return (v>=0?'+':'−') + '¥' + Math.abs(v).toLocaleString('ja-JP'); }
  function fmtDate(s){ if(!s) return '—'; var p=s.split('-'); if(p.length<3) return s; return p[2]+'.'+p[1]+'.'+p[0]; }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var EXP_CATS = [
    ['purchase','Покупка авто'],
    ['auction_fee','Аукционный сбор'],
    ['transport','Доставка / транспорт'],
    ['parts','Запчасти'],
    ['repair','Ремонт / работы'],
    ['customs','Растаможка / налоги'],
    ['other','Прочее (расход)']
  ];
  var INC_CATS = [
    ['car_sale','Продажа авто'],
    ['parts_sale','Продажа запчастей'],
    ['insurance','Страховая выплата'],
    ['other','Прочее (доход)']
  ];
  function catLabel(kind, code){
    var list = kind==='expense' ? EXP_CATS : INC_CATS;
    for(var i=0;i<list.length;i++){ if(list[i][0]===code) return list[i][1]; }
    return code;
  }
  function catOptions(kind, selected){
    var list = kind==='expense' ? EXP_CATS : INC_CATS;
    return list.map(function(c){ return '<option value="'+c[0]+'"'+(c[0]===selected?' selected':'')+'>'+esc(c[1])+'</option>'; }).join('');
  }

  function carName(car){
    if(!car) return 'Неизвестная машина';
    return [car.brand, car.model].filter(Boolean).join(' ') + (car.year ? ' \''+String(car.year).slice(-2) : '');
  }

  function carStats(carId){
    var invested=0, income=0;
    state.txs.forEach(function(t){
      if(t.carId!==carId) return;
      if(t.kind==='expense') invested += Number(t.amount)||0; else income += Number(t.amount)||0;
    });
    return { invested: invested, income: income, profit: income-invested };
  }
  function allStats(){
    var invested=0, income=0;
    state.txs.forEach(function(t){
      if(t.kind==='expense') invested += Number(t.amount)||0; else income += Number(t.amount)||0;
    });
    return { invested: invested, income: income, profit: income-invested };
  }

  function ensureName(force){
    if(state.me && !force) return;
    var n = window.prompt('Как вас записывать в операциях? (имя или ник)', state.me||'');
    if(n && n.trim()){
      state.me = n.trim();
    } else if(!state.me){
      state.me = 'Гость';
    }
    try{ localStorage.setItem('cl_ledger_name', state.me); }catch(e){}
    renderHeader();
  }

  // ---------- firebase / db ----------
  function initDb(){
    try{
      if(!window.firebase || !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('__')===0){
        state.dbOK = false; renderAll(); return;
      }
      firebase.initializeApp(firebaseConfig);
      firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(function(){});
      firebase.auth().signInAnonymously().catch(function(err){
        console.error('auth error', err);
        state.dbOK = false; renderAll();
      });
      firebase.auth().onAuthStateChanged(function(user){
        if(!user) return;
        db = firebase.firestore();
        state.dbOK = true;
        db.collection('cars').onSnapshot(function(snap){
          var m = new Map();
          snap.forEach(function(doc){ m.set(doc.id, Object.assign({id:doc.id}, doc.data())); });
          state.cars = m;
          renderAll();
        }, function(err){ console.error(err); });
        db.collection('transactions').onSnapshot(function(snap){
          var m = new Map();
          snap.forEach(function(doc){ m.set(doc.id, Object.assign({id:doc.id}, doc.data())); });
          state.txs = m;
          renderAll();
        }, function(err){ console.error(err); });
        renderAll();
      });
    }catch(e){
      console.error(e);
      state.dbOK = false; renderAll();
    }
    setTimeout(function(){ if(state.dbOK===null){ state.dbOK=false; renderAll(); } }, 6000);
  }

  function saveCar(data, id){
    if(!db) return Promise.reject();
    var now = new Date().toISOString();
    if(id) return db.collection('cars').doc(id).update(Object.assign({}, data, {updatedAt: now}));
    return db.collection('cars').add(Object.assign({}, data, {addedBy: state.me||'—', createdAt: now, updatedAt: now}));
  }
  function deleteCarCascade(id){
    if(!db) return;
    if(!window.confirm('Удалить машину и все связанные операции? Это необратимо.')) return;
    var related = [];
    state.txs.forEach(function(t){ if(t.carId===id) related.push(t.id); });
    Promise.all(related.map(function(tid){ return db.collection('transactions').doc(tid).delete(); }))
      .then(function(){ return db.collection('cars').doc(id).delete(); })
      .then(function(){ if(state.detailCarId===id) closeModal(); });
  }
  function saveTx(data, id){
    if(!db) return Promise.reject();
    if(id) return db.collection('transactions').doc(id).update(data);
    return db.collection('transactions').add(Object.assign({}, data, {addedBy: state.me||'—', createdAt: new Date().toISOString()}));
  }
  function deleteTx(id){
    if(!db) return;
    if(!window.confirm('Удалить операцию?')) return;
    db.collection('transactions').doc(id).delete();
  }

  }

    function renderForm(){
      modalRoot.innerHTML = backdrop(

        (carOptions.length ? (

            '<div class="field"><label>Сумма, ¥</label><input id="f-amount" type="number" min="0" step="1" required value="'+esc(tx&&tx.amount||'')+'"></div>'+
          '</div>'+
          '<div class="field"><label>Комментарий</label><input id="f-note" value="'+esc(tx&&tx.note||'')+'" placeholder="напр. передний бампер"></div>'+
          '<div class="modal-actions">'+
            (txId ? '<button type="button" class="btn danger" id="mDelete">Удалить</button>' : '') +
            '<button type="button" class="btn ghost" id="mCancel">Отмена</button>'+
            '<button type="submit" class="btn primary">Сохранить</button>'+

      document.querySelectorAll('#kindRow .chip').forEach(function(btn){

  function openCarDetail(carId){

  function renderDashboard(){
    var s = allStats();
    var activeCars=0, soldCars=0;
    state.cars.forEach(function(c){ if(c.status==='sold') soldCars++; else activeCars++; });

    var perCar = [];
    state.cars.forEach(function(c){ perCar.push(Object.assign({car:c}, carStats(c.id))); });
    perCar.sort(function(a,b){ return b.profit - a.profit; });
    var maxAbs = perCar.reduce(function(m,p){ return Math.max(m, Math.abs(p.profit)); }, 1);

    var barsHtml = perCar.length ? perCar.map(function(p){
      var pct = Math.max(3, Math.round(Math.abs(p.profit)/maxAbs*100));
      var color = p.profit>=0 ? 'var(--good)' : 'var(--bad)';
      return '<div class="bar-row" data-open-car="'+p.car.id+'">'+
        '<div class="bar-name">'+esc(carName(p.car))+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+color+';"></div></div>'+
        '<div class="bar-amt tnum" style="color:'+color+'">'+signedY(p.profit)+'</div>'+
      '</div>';
    }).join('') : '<p class="empty">Добавьте машину, чтобы увидеть прибыль по каждой.</p>';

    var feed = [];
    state.txs.forEach(function(t){ feed.push(t); });
    feed.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''); });
    feed = feed.slice(0,8);
    var feedHtml = feed.length ? feed.map(function(t){
      var car = state.cars.get(t.carId);
      var isInc = t.kind==='income';
      return '<div class="feed-row">'+
        '<div class="feed-date">'+fmtDate(t.date)+'</div>'+
        '<div class="feed-mid"><span class="car">'+esc(carName(car))+'</span> · <span class="cat">'+esc(catLabel(t.kind,t.category))+(t.note?' — '+esc(t.note):'')+'</span></div>'+
        '<div class="feed-amt tnum" style="color:'+(isInc?'var(--good)':'var(--bad)')+'">'+(isInc?'+':'−')+fmtY(t.amount)+'</div>'+
      '</div>';
    }).join('') : '<p class="empty">Операций пока нет.</p>';

    var html =
      '<div class="kpi-grid">'+
        '<div class="kpi"><div class="lbl">Вложено всего</div><div class="val tnum">'+fmtY(s.invested)+'</div></div>'+
        '<div class="kpi"><div class="lbl">Выручка всего</div><div class="val tnum">'+fmtY(s.income)+'</div></div>'+
        '<div class="kpi"><div class="lbl">Чистая прибыль</div><div class="val tnum '+(s.profit>=0?'good':'bad')+'">'+signedY(s.profit)+'</div></div>'+
        '<div class="kpi"><div class="lbl">Машин в работе</div><div class="val tnum">'+activeCars+'</div><div class="sub">Продано: '+soldCars+'</div></div>'+
      '</div>'+
      '<div class="panel"><div class="section-title">Прибыль по машинам</div>'+barsHtml+'</div>'+
      '<div class="panel"><div class="section-title">Последние операции</div>'+feedHtml+'</div>';
    return html;
  }

  function renderHeader(){
    document.querySelectorAll('#tabs button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-tab')===state.tab);
    });
    var who = document.getElementById('whoBtn');
    who.innerHTML = '👤 <b>'+esc(state.me||'Гость')+'</b>';
  }

  function renderAll(){
    renderHeader();
    var wrap = document.getElementById('wrap');
    if(state.dbOK===null){
      wrap.innerHTML = '<p class="empty">Загрузка…</p>';
    } else if(state.dbOK===false){
      wrap.innerHTML = '<div class="status-banner">База данных не настроена или недоступна. Проверьте подключение к интернету и настройки Firebase в этом файле (firebaseConfig).</div>';
    } else if(state.tab==='dashboard'){
      wrap.innerHTML = renderDashboard();
    } else {
      wrap.innerHTML = renderCars();
    }
    wireWrapEvents();
    if(state.modalKind==='detail') renderDetailModal();
  }

  function wireWrapEvents(){
    var wrap = document.getElementById('wrap');
    wrap.querySelectorAll('[data-open-car]').forEach(function(el){
      el.addEventListener('click', function(){ openCarDetail(el.getAttribute('data-open-car')); });
    });
    wrap.querySelectorAll('[data-edit-car]').forEach(function(el){
      el.addEventListener('click', function(){ openCarModal(el.getAttribute('data-edit-car')); });
    });
    wrap.querySelectorAll('[data-filter]').forEach(function(el){
      el.addEventListener('click', function(){ state.carFilter = el.getAttribute('data-filter'); renderAll(); });
    });
    var newCarBtn = document.getElementById('newCarBtn');
    if(newCarBtn) newCarBtn.onclick = function(){ openCarModal(null); };
  }

  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){ state.tab = b.getAttribute('data-tab'); renderAll(); });
  });
  document.getElementById('whoBtn').addEventListener('click', function(){ ensureName(true); });
  document.getElementById('quickAddBtn').addEventListener('click', function(){ openTxModal(null, null, null); });

  renderHeader();
  renderAll();
  initDb();
